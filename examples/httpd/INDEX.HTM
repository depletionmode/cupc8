<h1>Hello from a CUPC/8</h1>
<p>This page is INDEX.HTM on the SD card. HTTPD.PRG, a native program on an
8-bit CPU with two registers, reads it on every request and sends it out
through the Wi-Fi card, 128 bytes at a time.</p>
<p>Edit the file on the card and reload: the change shows at once.</p>
<hr><p><small>CUPC/8 httpd</small></p>
