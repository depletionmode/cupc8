# ============================================================================
# SYN / FML: synthesis-level checks on both FPGA designs
# ============================================================================

[[test]]
id = "RST-001"
title = "CPU reset follows the CPU card's CDONE"
checks = "no sysctl needed: /CPU_RST held from power-on until the CPU card's CDONE plus 16 clocks, reported in bridge STATUS bit 7; CDONE dropping (a reconfiguration, or a glitch) resets the CPU again"
method = "tb_chipset section RST-001, plus start-up checks in every section"
kind = "sim"
vrow = "1.5"
cmd = "soc/tb/run_ghdl.sh tb_chipset soc/spi_master.vhd soc/bridge.vhd soc/chipset.vhd soc/tb/models/sram_model.vhd soc/tb/models/sst39_model.vhd soc/tb/tb_chipset.vhd -- -gONLY=RST-001"

[[test]]
id = "RST-002"
title = "No /RDY for a cycle abandoned by reset"
checks = "a RAM read and an I/O read started at every clock around /CPU_RST asserting: the chipset never pulses /RDY while /STB is high (the race BUS-004 found); a monitor checks this in every tb_chipset section"
method = "tb_chipset section RST-002; the bus model drops its request on reset, as the card does"
kind = "sim"
vrow = "1.5"
cmd = "soc/tb/run_ghdl.sh tb_chipset soc/spi_master.vhd soc/bridge.vhd soc/chipset.vhd soc/tb/models/sram_model.vhd soc/tb/models/sst39_model.vhd soc/tb/tb_chipset.vhd -- -gONLY=RST-002"

[[test]]
id = "MUT-001"
title = "Counterexamples: fixed bugs stay caught"
checks = "each mutant puts a fixed bug (or a property's target fault) back into a copy of the RTL; its formal property and its simulation test must then fail"
method = "tools/formal.py --mutants (the reset race: bus_rdy_in_cycle and RST-002; RAM+ROM enabled together; a two-clock /RDY)"
kind = "formal"
vrow = "1.4"
cmd = "python3 tools/formal.py --mutants"

[[test]]
id = "MUT-002"
title = "Counterexamples: every fixed bug fails its test when put back"
checks = "for each entry in test/counterexamples.toml, the bug restored in a scratch worktree of HEAD makes its test fail with the expected messages"
method = "tools/counterexamples.py (git worktree + pre-fix files or a revert of the fixed code)"
kind = "sim"
vrow = "4.0"
cmd = "python3 tools/counterexamples.py"
