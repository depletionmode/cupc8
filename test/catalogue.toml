kind = "sim"
vrow = "2.7"
cmd = "make -s -C fw test_sysctl"

[[test]]
id = "SYS-006"
title = "Real binary: sysctl over USB"
checks = "the real sysctl.elf: the mux pins (released until a slot is selected); the UART tunnel at 115200 through a loopback, more bytes than the PIO FIFO holds between polls; SWD at pin level (the wake-up bit-exact, TARGETSEL, a DPIDR read through the turnarounds); drives no machine pin at start-up; enumerates as USB CDC; PING, POWER (CC 0.9 V gives class 2), bridge commands refused with the chipset down; FLASH_* refused until FPGA_HOLD, then ID, erase, program and read back 1500 bytes into the right flash only, the other untouched; FPGA_BOOT releases CRESET_n and sees CDONE, times out on a flash without a bitstream, and lets go of the flash lines; CARD_RESET drives only that slot's expander bit; a bad CRC gets status 1"
method = "test/emu/test_sysctl.mjs: rp2040js USB CDC host, W25Q and iCE40 CDONE models on SPI1 and the CS/CRESET pins, TCA9555 models on I2C0"
kind = "sim"
vrow = "2.7"
cmd = "tools/fw_rp2040.sh sysctl && node test/emu/test_sysctl.mjs"

[[test]]
id = "SYS-004"
title = "Card programming"
checks = "the programming port in the sysctl core: the mux (released = channel 7, bad slots refused); SWD against a bit-level RP2040 target: no answer while dormant, the ADIv5.2 wake-up, multi-drop TARGETSEL (another core deselects), DPIDR, FAULT before power-up and ABORT, CTRL/STAT power-up, AHB-AP word accesses with posted reads and RDBUFF, WAIT retried, several transfers per frame; the UART tunnel. The flash algorithms are HOST-002's, against sysctl_sim"
method = "host tests"
kind = "sim"
vrow = "2.7"
cmd = "make -s -C fw test_sysctl"

[[test]]
