method = "fw/test/test_sysctl.c: bridge (byte-exact to bridge.vhd) + SST39 models"
kind = "sim"
vrow = "2.7"
cmd = "make -s -C fw test_sysctl"

[[test]]
id = "SYS-006"
title = "Real binary: sysctl over USB"
checks = "the real sysctl.elf: the mux pins (released until a slot is selected); the UART tunnel at 115200 through a loopback, more bytes than the PIO FIFO holds between polls; SWD at pin level (the wake-up bit-exact, TARGETSEL, a DPIDR read through the turnarounds); drives no machine pin at start-up; enumerates as a composite device with two CDC ports (the protocol, the console); PING, POWER (CC 0.9 V gives class 2), bridge commands refused with the chipset down; FLASH_* refused until FPGA_HOLD, then ID, erase, program and read back 1500 bytes into the right flash only, the other untouched; FPGA_BOOT releases CRESET_n and sees CDONE, times out on a flash without a bitstream, and lets go of the flash lines; CARD_RESET drives only that slot's expander bit; a bad CRC gets status 1; the console port: no bridge frame while it is closed or the chipset held, the card polling the rings (BR_CS_n frames) once it is open and the chipset up, and stopping when it closes"
method = "test/emu/test_sysctl.mjs: a composite USB CDC host (test/emu/cdchost.mjs, emu/rp2040/src/usb/cdchost.cpp), W25Q and iCE40 CDONE models on SPI1 and the CS/CRESET pins, TCA9555 models on I2C0"
kind = "sim"
vrow = "2.7"
cmd = "tools/fw_rp2040.sh sysctl && node test/emu/test_sysctl.mjs"

[[test]]
id = "SYS-004"
title = "Card programming"
checks = "the programming port in the sysctl core: the mux (released = channel 7, bad slots refused); SWD against a bit-level RP2040 target: no answer while dormant, the ADIv5.2 wake-up, multi-drop TARGETSEL (another core deselects), DPIDR, FAULT before power-up and ABORT, CTRL/STAT power-up, AHB-AP word accesses with posted reads and RDBUFF, WAIT retried, several transfers per frame; the UART tunnel. The flash algorithms are HOST-002's, against sysctl_sim"
method = "host tests"
kind = "sim"
vrow = "2.7"
cmd = "make -s -C fw test_sysctl"

[[test]]
id = "SYS-005"
title = "Power policy"
checks = "CC voltage to USB-C source class at every boundary; sysctl drives no card line at start-up, and holding one card in reset drives only that line"
method = "fw/test/test_sysctl.c; the power policy itself is KRN-004 (kernel refuses net under 1.5 A)"
kind = "sim"
vrow = "2.7"
cmd = "make -s -C fw test_sysctl"

[[test]]
id = "SYS-007"
title = "Far RAM access"
checks = "RAM_WRITE_FAR/RAM_READ_FAR across bank boundaries, across $0ffff and up to the last byte, in the bridge model's SRAM; RAM_WRITE still wraps past $ffff; argument checks (short, length 0, over 4096, past $7ffff, no data); refused with the chipset held"
method = "fw/test/test_sysctl.c sys007_far_ram against the bridge model (RAM_WR24/RAM_RD24, byte-exact to bridge.vhd)"
kind = "sim"
vrow = "2.7"
cmd = "make -s -C fw test_sysctl"

[[test]]
id = "SYS-008"
title = "USB console: the rings"
checks = "the console core against the bridge model's SRAM: no bridge traffic at all while the port is closed (500 ms, typed bytes left with the PC); HOST set on the first poll after opening, and again after the kernel zeroes CON_FLAGS at boot; output with \\n as CR LF, across the ring's wrap, a full ring (127 bytes) whole; the USB side full: nothing taken, then only what fits and never half a CR LF (con_write never given more than con_room); a kernel writing between the card's index read and its data: only the bytes up to the head read go now, the rest on the next poll; polls every CON_POLL_MS (2 ms) and not more often; input with CR as Enter, the LF of CR LF dropped (also split across polls), a lone LF as Enter; CON_IN_HEAD written after the data; the input ring wraps and fills (63 bytes), the rest waiting on the PC; junk in the indices' high bits ignored; the chipset held: no traffic; power-up junk in CON_FLAGS (the port open before the kernel boots): nothing sent, only the card's indices moved; closing clears HOST once, then no traffic; the protocol port unaffected"
method = "fw/test/test_sysctl.c sys008_console, with the bridge model's SRAM cycles logged (sysmodels.h on_ram) to check the order of writes and to play the CPU between the card's cycles"
kind = "sim"
vrow = "2.7"
cmd = "make -s -C fw test_sysctl"

