[[test]]
id = "E2E-002"
title = "Blank board to BASIC"
checks = "blank ROM → program over USB → boot → BASIC → type and run a program → golden HDMI frame"
method = "co-sim"
kind = "sim"
vrow = "3.2"

[[test]]
id = "E2E-003"
title = "Network fetch"
checks = "Wi-Fi join → TCP fetch from a local server → page shown"
method = "co-sim"
kind = "sim"
vrow = "3.2"

[[test]]
id = "E2E-004"
title = "Negative system tests"
checks = "no CPU card, empty slots, corrupt kernel, interrupted ROM programming, card removed mid-run, low-power source: each behaves as specified"
method = "co-sim"
kind = "sim"
vrow = "3.3"

[[test]]
id = "E2E-005"
title = "Pin consistency"
checks = "pins.yaml = .pcf = pins.h = KiCad netlists; iCE40 pin roles match the Lattice CSV"
method = "hw/tools/pincheck.py"
kind = "static"
vrow = "3.4"

# ============================================================================
# Board tests. Every board gets the same static set (-0xx), board-specific
# checks (-05x), and hardware bring-up tests (-1xx, kind = "hw").
# ============================================================================

# ---------------------------------------------------------------- MAIN BOARD
[[test]]
id = "MB-001"
title = "Main board ERC"
checks = "0 errors; every waiver justified in writing"
method = "kicad-cli sch erc"
kind = "static"
vrow = "4.1"

[[test]]
id = "MB-002"
title = "Main board DRC"
checks = "0 errors, 0 unconnected, JLC 4-layer rules"
method = "kicad-cli pcb drc"
kind = "static"
vrow = "4.2"

[[test]]
id = "MB-003"
title = "Main board BOM"
checks = "every line has an LCSC number, is in stock at ≥ 2× the build quantity, and its package matches the footprint"
method = "hw/tools/bomcheck.py + jlcparts.py"
kind = "static"
vrow = "4.8"

[[test]]
id = "MB-004"
title = "Main board footprints and pinouts"
checks = "every symbol pin matches the datasheet table; pin 1 and rotation match the JLC CPL convention"
method = "hw/tools/fpcheck.py"
kind = "static"
vrow = "4.3"

[[test]]
id = "MB-005"
title = "Main board power"
checks = "3V3 buck startup and load step; 1V2 LDO; USB-C inrush; 6-slot worst case within budget; CC divider thresholds"
method = "ngspice decks in hw/mainboard/sim/"
kind = "sim"
vrow = "4.4"

[[test]]
id = "MB-006"
title = "Main board thermal"
checks = "all regulators Tj ≤ 100 °C at 40 °C ambient"
method = "hw/power/budget.py"
kind = "static"
vrow = "4.5"

[[test]]
id = "MB-007"
title = "Main board signal integrity"
checks = "USB D+/D− 90 Ω ±10%; SPI bus with 6 slots loaded; SRAM/ROM bus; CPU socket bus; clocks: no ringing past thresholds"
method = "openEMS + ngspice/IBIS"
kind = "sim"
vrow = "4.6"

[[test]]
id = "MB-008"
title = "Main board mechanical"
checks = "CPU card + 6 cards fitted with no collisions; mounting holes; connector overhang"
method = "FreeCAD fit script"
kind = "static"
vrow = "4.7"

[[test]]
id = "MB-009"
title = "Main board fab package"
checks = "Gerbers re-imported and DRC-clean; drill file matches the holes; CPL render reviewed (hand check recorded)"
method = "hw/tools/fabcheck.py"
kind = "static"
vrow = "4.9"

[[test]]
id = "MB-050"
title = "Main board connector pinouts match the specs"
checks = "CPU socket = cpu-bus.md table; each slot = slot.md table; pull-ups and series resistors as specified"
method = "netlist check script"
kind = "static"
vrow = "3.4"

[[test]]
id = "MB-051"
title = "Main board reset and power sequencing"
checks = "sysctl holds /CPU_RST and CARD_RST_n until rails are within 5%; iCE40 power-up order meets the datasheet"
method = "ngspice + sysctl model"
kind = "sim"
vrow = "4.4"

[[test]]
id = "MB-052"
title = "Main board board-level co-sim"
checks = "main board netlist + chipset + sysctl + SRAM/ROM models pass BRG-001/002 and boot with a CPU-card model"
method = "co-sim subset generated from the main board netlist only"
kind = "sim"
vrow = "3.1"

[[test]]
id = "MB-101"
title = "Bring-up: rails"
checks = "5V_SYS, 3V3, 1V2 within 5%, ripple within spec, with rail LEDs on"
method = "manual, with a meter, recorded in bringup.md"
kind = "hw"
vrow = "5"

[[test]]
id = "MB-102"
title = "Bring-up: sysctl enumerates"
checks = "USB CDC device appears; cupc8.py status responds"
method = "cupc8.py status"
kind = "hw"
vrow = "5"

[[test]]
id = "MB-103"
title = "Bring-up: chipset configures"
checks = "bitstream flashed; CDONE high"
method = "cupc8.py fpga flash + status"
kind = "hw"
vrow = "5"

[[test]]
id = "MB-104"
title = "Bring-up: SRAM march test"
checks = "March C- over all 512 KB through the bridge"
method = "cupc8.py selftest ram"
kind = "hw"
vrow = "5"

[[test]]
id = "MB-105"
title = "Bring-up: ROM program and verify"
checks = "chip ID read; erase/program/verify of the full image"
method = "cupc8.py rom write --verify"
kind = "hw"
vrow = "5"

[[test]]
id = "MB-106"
title = "Bring-up: slot and SPI loopback"
checks = "PRSNT, CARD_RST_n, PROG_n and the SPI lines of each slot, via a slot test card or card IDENT"
method = "cupc8.py selftest slots"
kind = "hw"
vrow = "5"

# ---------------------------------------------------------------- CPU CARD
[[test]]
id = "CC-001"
title = "CPU card ERC"
checks = "0 errors"
method = "kicad-cli sch erc"
kind = "static"
vrow = "4.1"

[[test]]
id = "CC-002"
title = "CPU card DRC"
checks = "0 errors, 0 unconnected"
method = "kicad-cli pcb drc"
kind = "static"
vrow = "4.2"

[[test]]
id = "CC-003"
title = "CPU card BOM"
checks = "LCSC, stock and package, as MB-003"
method = "bomcheck"
kind = "static"
vrow = "4.8"

[[test]]
id = "CC-004"
title = "CPU card footprints and pinouts"
checks = "as MB-004"
method = "fpcheck"
kind = "static"
vrow = "4.3"

[[test]]
id = "CC-005"
title = "CPU card power"
checks = "1V2 LDO from the socket's 3V3: startup, load step, dropout"
method = "ngspice"
kind = "sim"
vrow = "4.4"

[[test]]
id = "CC-007"
title = "CPU card signal integrity"
checks = "bus fan-out to the edge fingers; CPU_CLK integrity"
method = "ngspice/IBIS"
kind = "sim"
vrow = "4.6"

[[test]]
id = "CC-008"
title = "CPU card mechanical"
checks = "edge fingers match PCIe CEM x8 dimensions and key; fits the socket; clears the neighbouring card"
method = "FreeCAD fit script + finger dimension check"
kind = "static"
vrow = "4.7"

[[test]]
id = "CC-009"
title = "CPU card fab package"
checks = "as MB-009, plus gold fingers + bevel noted in the fab notes"
method = "fabcheck"
kind = "static"
vrow = "4.9"

[[test]]
id = "CC-050"
title = "CPU card edge pinout matches cpu-bus.md"
checks = "every finger net matches the spec table; CARD_ID straps = 10; PRSNT1 joined to PRSNT2"
method = "netlist check script"
kind = "static"
vrow = "3.4"

[[test]]
id = "CC-051"
title = "CPU card board-level co-sim"
checks = "card netlist + CPU netlist passes BUS-001..003 through the modelled socket"
method = "co-sim subset"
kind = "sim"
vrow = "3.1"

[[test]]
id = "CC-101"
title = "Bring-up: CPU card configures and steps"
checks = "CRAM load, CDONE; single-step the first 100 boot-ROM instructions; trace = sim.nim --boot:rom"
method = "cupc8.py cpu load + trace --diff"
kind = "hw"
vrow = "5"

