checks = "x1 fingers per CEM; USB-A overhang; clearance"
method = "FreeCAD fit script"
kind = "static"
vrow = "4.7"

[[test]]
id = "IC-009"
title = "IO card fab package"
checks = "as CC-009; the board's name and revision ('<name> rev <X>') on the top silkscreen and in the Gerber X2 attributes"
method = "fabcheck"
kind = "static"
vrow = "4.9"

[[test]]
id = "IC-050"
title = "IO card edge pinout"
checks = "fingers = slot.md; RP2040 pins = fw/io pins.h"
method = "netlist check"
kind = "static"
vrow = "3.4"

[[test]]
id = "IC-101"
title = "Bring-up: IO card"
checks = "flash over SWD; IDENT = $02; three different keyboards type correctly; VBUS short trips the fault flag"
method = "cupc8.py card flash/ident + typing test"
kind = "hw"
vrow = "5"

# ---------------------------------------------------------------- WI-FI CARD
[[test]]
id = "WC-001"
title = "Wi-Fi card ERC"
checks = "0 errors"
method = "kicad-cli sch erc"
kind = "static"
vrow = "4.1"

[[test]]
id = "WC-002"
title = "Wi-Fi card DRC"
checks = "0 errors, 0 unconnected"
method = "kicad-cli pcb drc"
kind = "static"
vrow = "4.2"

[[test]]
id = "WC-003"
title = "Wi-Fi card BOM"
checks = "as MB-003; antenna ordered as a loose part"
method = "bomcheck"
kind = "static"
vrow = "4.8"

[[test]]
id = "WC-004"
title = "Wi-Fi card footprints and pinouts"
checks = "as MB-004; module pad map against the ESP32-C3-MINI-1U datasheet"
method = "fpcheck"
kind = "static"
vrow = "4.3"

[[test]]
id = "WC-005"
title = "Wi-Fi card power"
checks = "TLV62569 buck + bulk capacitance hold 3V3 ≥ 3.0 V through a 350 mA TX burst, on the laid-out board"
method = "ngspice"
kind = "sim"
vrow = "4.4"

[[test]]
id = "WC-006"
title = "Wi-Fi card strapping"
checks = "GPIO2/8/9 and EN levels at reset give normal boot with PROG_n released and download mode with PROG_n low"
method = "ngspice RC model + a strapping-table check"
kind = "sim"
vrow = "4.4"

[[test]]
id = "WC-008"
title = "Wi-Fi card mechanical"
checks = "x1 fingers per CEM; MHF III access; antenna cable route"
method = "FreeCAD fit script"
kind = "static"
vrow = "4.7"

[[test]]
id = "WC-009"
title = "Wi-Fi card fab package"
checks = "as CC-009; the board's name and revision ('<name> rev <X>') on the top silkscreen and in the Gerber X2 attributes"
method = "fabcheck"
kind = "static"
vrow = "4.9"

[[test]]
id = "WC-050"
title = "Wi-Fi card edge pinout"
checks = "fingers = slot.md incl. PROG_n→GPIO9, SWCLK→U0RXD, SWDIO→U0TXD; firmware pin config matches"
method = "netlist check"
kind = "static"
vrow = "3.4"

[[test]]
id = "WC-101"
title = "Bring-up: Wi-Fi card"
checks = "flash over the UART bootloader; IDENT = $03; join a network; HTTPS fetch"
method = "cupc8.py card flash/ident + net test"
kind = "hw"
vrow = "5"
