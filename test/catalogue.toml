checks = "the real ESP-IDF image (core, lwIP, esp-tls, DNS task, frame engine with the SPI slave's preload rules): IDENT, SCAN, JOIN with DHCP (10.0.2.15, gw, dns), LINK and RXREADY in the status byte, failed RESOLVE, TCP client both ways with PEER_CLOSED, LISTEN/ACCEPTED, UDP_SENDTO, CONNECT_HOST to an unresolvable name, and TLS refusing a self-signed certificate after a real handshake; NET_CONFIG_GET's power-up defaults; a UDP server: UDP_BIND, RECVFROM through a hostfwd (nothing waiting: n 0; a datagram with its sender 10.0.2.2), UDP_SENDTO back to the sender, and a second client still heard after that reply; an ICMP echo request the test built sent to 10.0.2.2 on a raw ICMP socket, the reply (QEMU's) from RECVFROM with id, sequence, payload and checksum intact and the IP header stripped; NET_CONFIG's DNS server in NET_STATUS over DHCP's; a static address (10.0.2.20) in use at once, TCP from it; saved: after a power cycle on the same flash NET_CONFIG_GET has it (saved 1) and JOIN comes up on it without DHCP, TCP from it; back to DHCP (saved) gets the lease 10.0.2.15 and DNS 10.0.2.3 again. Optional (CUPC8_ONLINE=1, not yet passing): verified TLS and an HTTPS GET to example.com"
method = "Espressif QEMU 9.2.2 esp32c3, OpenCores Ethernet on user-mode NAT, frames over UART1 (QEMU has no SPI slave); tools/fw_esp32c3.sh qemu"
