# CUPC/8 test catalogue: every test in the project, one entry each.
#
# test/run.py reads this file. An entry with a `cmd` is implemented and gets
# run. An entry without one is designed but pending. `make verify` (the fab
# gate) fails while any sim/static/formal test is failing or pending.
# hw-kind tests run on the real boards after delivery, through cupc8.py.
#
# Fields:
#   id       unique; the prefix is the block or board
#   title    one line
#   checks   what "pass" means
#   method   how the test works
#   kind     sim | static | formal | hw
#   vrow     row in doc/hardware/verification.md
#   cmd      shell command run from the repo root; exit 0 = pass

# ============================================================================
# SIM: the reference model itself
# ============================================================================
[[test]]
id = "SIM-001"
title = "Simulator regression suite"
checks = "every assertion in tools/simtest.nim holds (ISA semantics, IRQs, timers, WAI, display, SD)"
method = "tools/run_tests.sh builds simtest against sim.nim + as.py"
kind = "sim"
vrow = "2.1"
cmd = "tools/run_tests.sh"

[[test]]
id = "SIM-004"
title = "Simulator models the M1 machine (cards mode)"
checks = "ROM windows and banking, SYSCTL/ROM_BANK/SLOT_IRQ, per-device SPI with SPI_CS, slot cards running the real firmware cores, and the GPU picture reaching the display"
method = "tools/simtest.nim testCardsMode, with fw/*/core linked in through fw/sim/simcards.c"
kind = "sim"
vrow = "2.1"
cmd = "tools/run_tests.sh"

[[test]]
id = "SIM-002"
title = "Simulator matches the manual, per instruction"
checks = "one directed program per opcode × format × register combination, with the expected results written out by hand from the manual (not generated by the simulator)"
method = "test/isa/*.s with ;@ checkpoints written by hand from the manual, run on sim.nim by test/isa/run_isa.py; tools/lockstep.py runs the same programs on the RTL (CPU-001)"
kind = "sim"
vrow = "2.1"
cmd = "python3 test/isa/run_isa.py"

[[test]]
id = "SIM-003"
title = "Assembler encodings"
checks = "as.py emits the manual's encoding for every mnemonic and format; bad input is rejected with an error"
method = "test/asm/test_asm.py: a golden table written by hand from the manual (61 encodings incl. the special push/pop operands), plus 6 inputs that must be rejected"
kind = "sim"
vrow = "2.8"

# ============================================================================
# CPU: cpu.vhd (the CPU card logic)
# ============================================================================
cmd = "python3 test/asm/test_asm.py"

[[test]]
id = "CPU-001"
title = "Lockstep vs sim.nim on all test programs (GHDL RTL)"
checks = "identical S/W/E traces (registers, flags, SP, PC and every memory write at every instruction boundary)"
method = "tools/lockstep.py: GHDL tb_cpu_trace vs tools/simtrace"
kind = "sim"
vrow = "1.2"
cmd = "python3 tools/lockstep.py"

[[test]]
id = "CPU-002"
title = "Random-program fuzzer, 10^6 instructions (Verilator netlist)"
checks = "≥ 10⁶ constrained-random instructions (all opcodes, IRQs, WAI, timers, stack and indirect addressing) with zero divergence"
method = "generator → assembler → lockstep, fixed seeds in CI plus one random seed per run (seed logged)"
kind = "sim"
vrow = "1.2"
cmd = "python3 tools/cpufuzz.py --engine verilator --programs 300 --seed 100 --min-instructions 1000000"


[[test]]
id = "CPU-008"
title = "Random-program fuzzer on the RTL (GHDL)"
checks = "the same generator as CPU-002 on the VHDL RTL, with random wait states: zero divergences"
method = "tools/cpufuzz.py --engine ghdl (slower, so fewer programs)"
kind = "sim"
vrow = "1.2"
cmd = "python3 tools/cpufuzz.py --engine ghdl --programs 64 --seed 200"


[[test]]
id = "CPU-009"
title = "Random-program fuzzer on the whole main board model"
checks = "the CPU-002 generator on the real CPU + chipset + SRAM/ROM timing models: zero divergences from sim.nim, zero memory timing violations"
method = "tools/cpufuzz.py --engine mainboard (tb_mainboard)"
kind = "sim"
vrow = "3.2"
cmd = "python3 tools/cpufuzz.py --engine mainboard --programs 48 --seed 300"

[[test]]
id = "CPU-003"
title = "Opcode × format coverage"
checks = "100% of opcode × format × Ra/Rb combinations are executed by CPU-001 + CPU-002"
method = "coverage counters in the lockstep harness"
kind = "sim"
vrow = "1.2"
cmd = "python3 tools/cpufuzz.py --engine verilator --programs 64 --seed 7"

[[test]]
id = "CPU-004"
title = "Reset behaviour"
checks = "after /CPU_RST: PC=$e000, SP=$0100, r0=r1=0, Z=I=0, timers stopped; reset held mid-instruction restarts cleanly"
method = "soc/tb/tb_cpu_directed.vhd running test/cpu/directed.s (labels passed in by tools/cpudirected.py)"
kind = "sim"
vrow = "1.3"
cmd = "python3 tools/cpudirected.py CPU-004"

[[test]]
id = "CPU-005"
title = "Interrupt entry and return"
checks = "IRQ taken only at instruction boundaries with I=1, lowest number first; push order pch, pcl, f; I cleared; vector read; pop f/pcl/pch returns exactly"
method = "soc/tb/tb_cpu_directed.vhd running test/cpu/directed.s (labels passed in by tools/cpudirected.py)"
kind = "sim"
vrow = "1.3"
cmd = "python3 tools/cpudirected.py CPU-005"

[[test]]
id = "CPU-006"
title = "Timers"
checks = "TMR0/TMR1 count retired instructions including WAI idle; TMR_EXP pulse exactly once per expiry; writing 0 stops a timer"
method = "soc/tb/tb_cpu_directed.vhd running test/cpu/directed.s (labels passed in by tools/cpudirected.py)"
kind = "sim"
vrow = "1.2"
cmd = "python3 tools/cpudirected.py CPU-006"

[[test]]
id = "CPU-007"
title = "WAI and HALT"
checks = "WAI is a NOP with I=0; parks with I=1 until an IRQ is accepted; HALT stops forever; HALTED/WAITING outputs are correct"
method = "soc/tb/tb_cpu_directed.vhd running test/cpu/directed.s (labels passed in by tools/cpudirected.py)"
kind = "sim"
vrow = "1.2"

