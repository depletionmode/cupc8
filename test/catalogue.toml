# ============================================================================
# POW / THM: the power tree (doc/hardware/power.md), verification 4.4 / 4.5.
# Values and assumptions: hw/power/design.py. The main board isn't drawn
# yet, so these check power.md's design plus the listed assumptions; the
# MB-005/MB-006 entries re-run them against the schematic once it exists.
# ============================================================================
[[test]]
id = "POW-001"
title = "3V3 buck: start-up, 0->500 mA step, dropout (TI TLV62569 model)"
checks = "3V3 within 3.135-3.465 V at the DC corners through start-up, a 0->500 mA step and its release, at 5V_SYS worst-low and 5.5 V; above the MAX811T threshold; up in <= 2 ms into the full load and 100 uF; 5V_SYS headroom over 100 % duty dropout"
method = "hw/power/buck.py: TI's PSpice transient model (fetched, sha256-pinned, VSWITCH ported) in ngspice, fed through the worst-case input path"
kind = "sim"
vrow = "4.4"
cmd = "python3 hw/power/buck.py"

[[test]]
id = "POW-002"
title = "1V2 LDO (RT9013): start-up, core step, dropout, PSRR"
checks = "model reproduces the datasheet load step within 25 %; 1V2 within the iCE40's 1.14-1.26 V with 2 % DC tolerance, the 0->40 mA step and the buck's ripple through the PSRR; dropout headroom at the lowest 3V3"
method = "hw/power/ldo.py 1v2: behavioural LDO (models/behavioural.lib) fitted to the RT9013 datasheet; AC analysis at POW-001's ripple frequencies"
kind = "sim"
vrow = "4.4"
cmd = "python3 hw/power/ldo.py 1v2"

[[test]]
id = "POW-003"
title = "Wi-Fi card TLV62569 buck: ESP32-C3 TX burst, dropout"
checks = "with the card as built (U2 TLV62569, L1 2.2 uH, 22 uF in, 22 uF + 100 nF out, R9/R10 453k/100k at 1 %) at the typical and worst-case slot +5V: ESP32-C3 supply >= 3.0 V through a 350 mA TX burst at the DC low corner, <= 3.6 V through start-up, light load and the burst's release at the DC high corner, and the card's +5V in the burst covers VOUT + I x (RDS(on) hot + DCR)"
method = "hw/power/buck.py wifi-card: TI's TLV62569 model fed through the whole source-to-card chain"
kind = "sim"
vrow = "4.4"
cmd = "python3 hw/power/buck.py wifi-card"

[[test]]
id = "POW-004"
title = "USB-C attach inrush"
checks = "<= 10 uF on VBUS ahead of the input eFuse; the attach surge through it stays under its minimum current limit (set by its dVdt soft start); 5V_SYS up within 10 ms; VBUS stays above the eFuse's UVLO; at vSafe5V max with the fastest slew and min with the slowest"
method = "hw/power/inrush.py: behavioural TPS25947 eFuse (dVdt ramp, current limit) into the 5V_SYS capacitance and the loads that start at attach"
kind = "sim"
vrow = "4.4"
cmd = "python3 hw/power/inrush.py"

[[test]]
id = "POW-005"
title = "USB-C CC divider, PWR_HI comparator and ADC thresholds"
checks = "every compliant source's CC voltage on our Rd falls on the right side of the PWR_HI trip points (PWR_HI = a 3.0 A source) (TLV7011 offset, hysteresis, 3V3 and resistor tolerances) and of sysctl's 0.20/0.66/1.23 V ADC thresholds; TI's TLV7011 model agrees at the window edges"
method = "hw/power/cc.py: tolerance stack-up against the Type-C Rp options, plus ngspice with TI's TLV7011 model"
kind = "static"
vrow = "4.4"
cmd = "python3 hw/power/cc.py"

[[test]]
id = "POW-006"
title = "Worst-case current budget, input path and slot feeds"
checks = "M1 worst case (four cards) within the 3.0 A source class, the eFuse's minimum current limit and the input PTC's 40 C hold, with 10 % margin, and the eFuse's maximum limit under 3.3 A; a 1.5 A source with the radio off and SD writes refused; default USB with the radio off at power.md's typical loads; slot.md's per-card +5V and +3V3 budgets against the slot PTC and each card (the IO card's +5V through its keyboard boost); keyboard VBUS 4.40-5.5 V; what is left for slots 5-6; the eFuse OVLO between vSafe5V max and 6 V; the TVS"
method = "hw/power/budget.py: power.md's max loads through the source/cable/fuse/switch/PTC chain at worst and typical corners"
kind = "static"
vrow = "4.4"
cmd = "python3 hw/power/budget.py"

[[test]]
id = "THM-001"
title = "Regulator junction temperatures at 40 C ambient"
checks = "Tj <= 100 C for the 3V3 buck (M1 load, and with slots 5-6 at 300 mA of +3V3 each), the Wi-Fi card's buck at TX, both RT9013s, the IO card's keyboard boost at 500 mA, the GPU card's HDMI buck-boost at 55 mA, the input eFuse and the IO card's SY6280, from datasheet theta_JA"
method = "hw/power/thermal.py: dissipation at each part's hottest corner x theta_JA"
kind = "static"
vrow = "4.5"
cmd = "python3 hw/power/thermal.py"

[[test]]
id = "POW-007"
title = "IO card keyboard boost: USB VBUS at the port (TI TPS61023 model)"
checks = "model regulates within 3 % of its set point; the keyboard's VBUS >= 4.40 V (USB 2.0 low-power port) through a 0->500 mA step at the DC low corner and <= 5.5 V at the DC high corner, at the worst and typical corners and at vSafe5V max (pass-through); boost up within 2 ms; inductor current under the 2.7 A valley limit"
method = "hw/power/boost.py: TI's PSpice transient model (fetched, sha256-pinned, ported), fed through the source-to-card chain, into the SY6280 port switch"
kind = "sim"
vrow = "4.4"
cmd = "python3 hw/power/boost.py"

[[test]]
id = "POW-008"
title = "GPU card HDMI +5V pin through its TPS63802 buck-boost"
checks = "the model reproduces the datasheet load-step figure within 25 %; the HDMI +5V pin within 4.8-5.3 V (VFB +-1 %, the divider's 1 % and the power-save ripple band) through a 10->55 mA step, at the worst and typical corners and at vSafe5V max; the converter's input under its 5.5 V OVP at vSafe5V max and over its 1.3 V minimum; the PTC ahead of it within its 40 C hold"
method = "hw/power/hdmi.py: behavioural buck-boost (TI's TPS63802 model does not run in ngspice-47), fitted to the datasheet, fed through the source-to-card chain, the PTC at R1max (worst) or Rmin"
kind = "sim"
vrow = "4.4"
cmd = "python3 hw/power/hdmi.py"


