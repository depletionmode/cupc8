# ============================================================================
# MECH: the mechanical fit of every board together (verification.md 4.7).
# One run of hw/mech/fit.py (cached in build/mech/results.json) answers all
# of them; it picks up each board as its build appears, and until the main
# board exists uses a stand-in for the row (slot.md, "One row of cards"): the
# CPU socket (C404111) then six I/O slots (C404113), 20.32 mm pitch. Report: build/mech/report.txt, render: overview.png.
# ============================================================================
[[test]]
id = "MECH-001"
title = "Card edge and socket fit vs PCIe CEM"
checks = "every card's finger tab against PCIe CEM r3.0 Fig. 6-3 (tab >= 8.40, key 1.90 +/- 0.06 at 12.15, DIM B, finger 0.70 +/- 0.05 at 1.00 pitch, pad tops 5.60, leading edge 1.30 +/- 0.25, short pads A1 and pin C at 2.40, 0.50 chamfers); in its socket (datasheet): shoulder above the housing, key rib in the notch, card in the 1.78 slot, no board inside the housing; nothing within 5 mm above the tab (slot.md)"
method = "hw/mech/fit.py: pads and outline from pcbnew; the tab in a datasheet socket solid in FreeCAD"
kind = "static"
vrow = "4.7"
cmd = "python3 hw/mech/fit.py --check MECH-001"

[[test]]
id = "MECH-002"
title = "Finger bevel and card thickness vs PCIe CEM"
checks = "each card's fab/order.json: thickness in 1.57 +/- 0.13, hard gold, bevel in CEM's 20 +/- 5 deg"
method = "hw/mech/fit.py reads the order spec kicadgen writes"
kind = "static"
vrow = "4.7"
cmd = "python3 hw/mech/fit.py --check MECH-002"

[[test]]
id = "MECH-003"
title = "Card-to-card clearance along the row, CPU card included"
checks = "the CPU card in position 1 and every I/O card in every I/O slot, next to every other: no collision and >= 1.0 mm (two cards' IPC-6012 bow), CPU card -> I/O slot 1 included (the FPGA's height); each card inside the CEM envelope (14.47 component side, 2.67 solder side); clear of the other sockets and the main board's parts. Fails while no CPU card is built"
method = "hw/mech/fit.py: STEP from kicad-cli, placed in FreeCAD; exact distances and intersection volumes"
kind = "static"
vrow = "4.7"
cmd = "python3 hw/mech/fit.py --check MECH-003"

[[test]]
id = "MECH-004"
title = "Top-edge connectors: overhang and plug access"
checks = "each top-edge connector's mating face at or past the card's top edge (>= -0.3 mm), and its plug's envelope clear of every other card, plug and part in every slot"
method = "hw/mech/fit.py (FreeCAD), plug envelopes in fit.py's PLUGS"
kind = "static"
vrow = "4.7"
cmd = "python3 hw/mech/fit.py --check MECH-004"

[[test]]
id = "MECH-005"
title = "One row: sockets in line at one height, M3 holes on the rail"
checks = "1 x8 and 6 x1 sockets, the CPU socket at one end, 20.32 mm apart, finger B1 in line (<= 0.05 mm), the same way round; x8 and x1 seat heights equal (C404111 vs C404113 datasheets, difference reported in mm); each row card's 3.2 mm hole at slot.md's (52, -40), on one axis in every position (<= 0.05 mm); a 6.4 mm rail keep-out through the row hits no part"
method = "hw/mech/fit.py (pcbnew + FreeCAD)"
kind = "static"
vrow = "4.7"
cmd = "python3 hw/mech/fit.py --check MECH-005"

[[test]]
id = "MECH-006"
title = "One row: one outline, top edges and power LEDs aligned"
