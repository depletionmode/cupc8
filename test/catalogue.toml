# CUPC/8 test catalogue: every test in the project, one entry each.
#
# test/run.py reads this file. An entry with a `cmd` is implemented and gets
# run. An entry without one is designed but pending. `make verify` (the fab
# gate) fails while any sim/static/formal test is failing or pending.
# hw-kind tests run on the real boards after delivery, through cupc8.py.
#
# Fields:
#   id       unique; the prefix is the block or board
#   title    one line
#   checks   what "pass" means
#   method   how the test works
#   kind     sim | static | formal | hw
#   vrow     row in doc/hardware/verification.md
#   cmd      shell command run from the repo root; exit 0 = pass

# ============================================================================
# SIM: the reference model itself
# ============================================================================
[[test]]
id = "SIM-001"
title = "Simulator regression suite"
checks = "every assertion in tools/simtest.nim holds (ISA semantics, IRQs, timers, WAI, display, SD)"
method = "tools/run_tests.sh builds simtest against sim.nim + as.py"
kind = "sim"
vrow = "2.1"
cmd = "tools/run_tests.sh"

[[test]]
id = "SIM-004"
title = "Simulator models the M1 machine (cards mode)"
checks = "ROM windows and banking, SYSCTL/ROM_BANK/SLOT_IRQ, per-device SPI with SPI_CS, slot cards running the real firmware cores, and the GPU picture reaching the display"
method = "tools/simtest.nim testCardsMode, with fw/*/core linked in through fw/sim/simcards.c"
kind = "sim"
vrow = "2.1"
cmd = "tools/run_tests.sh"

[[test]]
id = "SIM-010"
title = "The simulator CLI runs the M1 machine with its slot cards"
checks = "tools/sim headless (--type, --dump-text, --dump-fb): the default machine (hdmi,io) boots through the boot ROM to the BASIC prompt and runs a typed program; keys typed with no IO card, at the prompt and at a program parked in WAI with nothing to wake it (tools/testdata/park.s), still let the run end; with hdmi,io,storage,wifi and --sd on a missing image (made blank): SAVE, NEW, DIR (name and size), LOAD, RUN, the image valid FAT with the saved bytes (fatcheck.py), LOAD again in a second run; net join with any SSID gives 127.0.0.1 and net get reaches an HTTP server on localhost (the request arrives, the reply is on screen); eink and eink750: the program runs and the text is on the panel's glass; BASIC graphics (basic-graphics.md): on hdmi mode 1, cls 1 and a filled box in 196 put red and VGA blue in the dumped picture, on eink mode 2 boxes in greys 0-2 and refresh put 0, 85, 170 and 255 on the glass; the picture is the whole panel, 648 x 480 on eink and 800 x 480 on eink750, where a box drawn in mode 2 at x 780-799 is in --dump-fb; the headless exits judged in guest instructions (--max-ins, the run must settle well before it), the two real-time checks tried twice on a loaded host; --legacy still runs a program at $1000; interactively (SDL's dummy video driver) a guest woken from WAI by timer 0 every 50 instructions keeps its 12 MHz clock on the speed line (11-13 MHz: no sleep per WAI while the guest is behind the host clock)"
method = "test/sim/test_cli.py builds tools/sim and runs it as a user would; the HTTP server runs in the test"
kind = "sim"
vrow = "2.1"
cmd = "python3 test/sim/test_cli.py"

[[test]]
id = "SIM-011"
title = "Simulator timers count in WAI as the CPU does"
checks = "parked in WAI, cpu.vhd counts its timers once a turn of 3 clocks (tick, settle, check), 4 counts a microsecond: tmr0 #200 (counted down as TMR0 and WAI retire) wakes WAI after 198 turns, 594 clocks and the IRQ entry's 20; the code after WAI runs"
method = "tools/simtest.nim testWaiTimer (tools/testdata/wai_timer.s)"
kind = "sim"
vrow = "2.1"
cmd = "tools/run_tests.sh testWaiTimer"

[[test]]
id = "SIM-020"
title = "The simulator's --console: the USB console on its terminal"
checks = "tools/sim --console moves the API block's console rings to and from the terminal it runs in, as the system card does to a PC: from a pipe (headless), the banner and prompt on stdout with CR LF (and no bare LF), typed lines echoed, help and a BASIC program typed on stdin run (7 14 21, DONE.), the same on the graphics card, the sim's own status line on stderr and no escape codes in the stream, and it exits once stdin has ended and the machine is quiet; from a terminal (a pty): raw (no ICANON or ECHO) while it runs, a CR key is Enter, Ctrl-] quits with exit 0 and the terminal's settings put back"
method = "test/sim/test_console.py builds tools/sim and runs it on a pipe and on a pty"
kind = "sim"
vrow = "2.1"
cmd = "python3 test/sim/test_console.py"

[[test]]
id = "SIM-012"
title = "The simulator runs a program for $7000 (--run)"
checks = "tools/sim --run:PROG, once the kernel is at its prompt, does what cupc8.py run does (the body at $7000, then API_RUN = 1): tools/testdata/exec_prog.prg prints NATIVE OK and the prompt is back, and so does its bare binary; a header of version 2 is refused (exit 1, nothing runs); examples/hello (mkprg.py with kernel/api.inc) counts seconds headless (to at least 6 in 8 M instructions, with the guest ms on the status line); in the interactive sim (SDL's dummy video driver: the real-time loop without a window) hello's light steps once a wall-clock second (five steps, mean 0.98-1.04 s); net config and net ping 127.0.0.1 run on the sim's Wi-Fi card"
method = "test/sim/test_cli.py (builds tools/sim; the interactive check reads the sim's GPO lines against the host clock)"
kind = "sim"
vrow = "2.1"
cmd = "python3 test/sim/test_cli.py"

[[test]]
id = "SIM-013"
title = "The simulator's millisecond counter and tick"
checks = "sim.nim counts the CPU's clocks as cpu.vhd and the chipset spend them (4 a memory cycle, 2 an I/O cycle, 4 more an instruction, 3 a WAI idle turn, 20 an IRQ entry), the one guest time (the chipset's counter and the cards' ms): a program parked in WAI with only the tick unmasked takes two ticks on the SPI vector (CPU line 3) with IRQ_PEND $10, the second at MS_COUNT 100 and 1200000 clocks (+400); masked by bit 4 (SPI's bit 3 set) three ticks' worth leave it waiting, unmasked the pending tick is taken; MS_COUNT0 latches MS_COUNT1-3 across a carry of the low byte and at $12345678; IRQ_MASK reads back bits 4:0"
method = "tools/simtest.nim testMsCounter (tools/testdata/ms_tick.s; cardsLoadTest for the registers)"
kind = "sim"
vrow = "2.1"
cmd = "tools/run_tests.sh testMsCounter"


