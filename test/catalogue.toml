# ============================================================================
# BUS: CPU bus / CPU socket protocol (doc/hardware/cpu-bus.md)
# ============================================================================
[[test]]
id = "BUS-001"
title = "CPU-card conformance: wait states"
checks = "lockstep traces unchanged with 0, 1..7 fixed, and random 0..15 wait states"
method = "conformance testbench wrapping the CPU card top; chipset model inserts wait states"
kind = "sim"
vrow = "1.3"
cmd = "python3 tools/lockstep.py --waits 3 && python3 tools/lockstep.py --waits -1 --seed 11"

[[test]]
id = "BUS-002"
title = "CPU-card conformance: protocol monitor"
checks = "A/RW/write data stable while /STB is low and /RDY is high; D driven only in the allowed window; nothing driven during reset; SYNC only on opcode fetches"
method = "a protocol monitor that runs in every CPU-card simulation"
kind = "sim"
vrow = "1.3"

[[test]]
id = "BUS-003"
title = "CPU-card conformance: stop, step, reset"
checks = "a stall of any length, single-step (instruction and cycle), and random mid-cycle resets leave the trace identical"
method = "conformance testbench"
kind = "sim"
vrow = "1.3"

[[test]]
id = "BUS-004"
title = "CPU bus formal properties"
checks = "one D driver; /RDY only while /STB is low; /RDY exactly one clock wide; no bridge and CPU cycle granted together"
method = "SymbiYosys on the chipset bus front-end"
kind = "formal"
vrow = "1.4"

[[test]]
id = "BUS-005"
title = "Cross-connector timing budget"
checks = "card clock-to-out + connector + trace + chipset setup leaves ≥ 30% margin at 12 MHz, both directions"
method = "hw/timing/cpubus_budget.py using nextpnr timing, connector data and extracted trace lengths"
kind = "static"
vrow = "1.7"

