[[bug]]
name = "gpu firmware: the slot SPI interrupt could delay PicoDVI's past its porch, cross-wiring the TMDS lanes"
fixed_in = "9b4966c"
# The fix's other half (slotspi masking only its own IRQ) is gone on purpose:
# slotspi_refresh now turns every interrupt off for a few dozen cycles to swap
# the preload (18c444f). Whether a delayed DVI interrupt still makes its porch
# depends on how long the CS_n handler runs, so neither GPU-005's picture
# checks nor E2E-002's boot (which found it) catch it any more. GPU-005 checks
# the cause: CS_n rising at every point of a scanline, the DVI interrupt's
# longest wait (emulator-side, pending to entry) is 113 cycles with the fix,
# ~570 (the whole CS_n handler) with the bug.
revert = [
  ["fw/rp2040/gpu/main.c", "	irq_set_priority(DMA_IRQ_0, 0);\n", ""],
  ["fw/rp2040/common/slotspi.c", "	irq_set_priority(IO_IRQ_BANK0, 0x40);", "	irq_set_priority(IO_IRQ_BANK0, 0);"],
]
cmd = "cmake -G Ninja -S emu/rp2040 -B build/emu-native >/dev/null && ninja -C build/emu-native rp2040emu_node >/dev/null && tools/fw_rp2040.sh gpu && make -s -C fw gpu_golden && CUPC8_EMU=native node test/emu/test_gpu.mjs GPU-005"
must_fail = ["FAIL PicoDVI's DMA interrupt waits at most 250 cycles"]

