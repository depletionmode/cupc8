# Counterexamples: every fixed bug, put back, must make its test fail.
#
# tools/counterexamples.py checks out HEAD in a scratch worktree, puts the bug
# back, runs `cmd`, and requires it to FAIL with every `must_fail` text in its
# output. The bug goes back either as `files` restored from `before` (the
# commit before the fix), or, where the fix came with test hooks that the old
# file lacks, as `revert` pairs [file, fixed text, buggy text]. So each test
# is proven to catch the bug it guards, and the bug cannot come back unseen.
# (Bugs in the RTL are also covered by mutants: tools/formal.py --mutants.)

[[bug]]
name = "assembler: TMR0/TMR1 register in the Ra bit"
fixed_in = "e635dbd"
before = "f811788"
files = ["tools/as.py"]
cmd = "python3 test/asm/test_asm.py"
must_fail = ["FAIL tmr0 r1"]

[[bug]]
name = "kernel BASIC: tokenizer, mem_cmp, precedence, strings, FOR/NEXT, jumps, REM, ELSE, 0, /0, long lines"
fixed_in = "e635dbd"
before = "f811788"
# The fix touched ubasic.s, ubasic_tokenizer.s, printf.s, math.s and term.s;
# those old files no longer assemble with today's kernel (sys.s, the API,
# calls routines they lack), so the whole kernel as it was goes back, and
# the files added since go.
files = ["kernel"]
cmd = "rm -f kernel/api.inc kernel/api.s kernel/bank.s kernel/eink.s kernel/ping.s kernel/resolv.s kernel/storage.s kernel/sys.s && tools/run_tests.sh testBasicPrograms"
must_fail = ["FAIL: BASIC precedence", "FAIL: BASIC string", "FAIL: BASIC for/next", "FAIL: BASIC if/then/else",
             "FAIL: BASIC goto loop", "FAIL: BASIC gosub", "FAIL: BASIC nested for", "FAIL: BASIC parentheses",
             "FAIL: BASIC equals", "FAIL: BASIC zero", "FAIL: BASIC rem", "FAIL: BASIC mod, divide by 0",
             "FAIL: BASIC let in then", "FAIL: BASIC gosub nest", "FAIL: BASIC longest line"]

