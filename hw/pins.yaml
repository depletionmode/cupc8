# CUPC/8 Milestone 1 pin map: the single source of truth.
#
# Generators (hw/tools/genpins.py) produce from this file:
#   - the iCE40 .pcf constraints for the chipset and the CPU card
#   - firmware pin headers (fw/*/pins.h)
#   - the net names used by the schematic generator
#   - the pinout tables in the docs
# and hw/tools/pincheck.py verifies the generated files, the KiCad netlists and
# the Lattice pinout CSVs agree.
#
# FPGA pin numbers are filled in during schematic capture, when the package
# pinout and the layout fan-out are known; `pin: TBD` means "not yet assigned".
# Roles: in, out, inout, power, gnd, nc.

meta:
  clock_mhz: 12
  boards: [mainboard, cpu-card, system-card, gpu-card, io-card, wifi-card, storage-card, eink-card]

devices:

  chipset:
    board: mainboard
    part: ICE40HX4K-TQ144
    lcsc: C1521989
    package: TQFP-144
    note: >
      95 of 107 I/O used. Bank assignment and pin numbers are set during
      layout; every pin here must land on a normal I/O (the config pins
      SPI_SS_B, SPI_SCK, SPI_SI, SPI_SO and CRESET_B/CDONE are reserved for
      configuration).
    groups:
      cpu_bus:
        note: CPU socket, doc/hardware/cpu-bus.md
        signals:
          - {name: CPU_A, width: 16, dir: in, pin: [1, 2, 3, 4, 7, 8, 9, 10, 11, 12, 15, 16, 17, 18, 19, 20]}
          - {name: CPU_D, width: 8, dir: inout, pin: [22, 23, 24, 25, 26, 28, 29, 31]}
          - {name: CPU_RW, dir: in, pin: 32}
          - {name: CPU_nSTB, dir: in, pin: 33}
          - {name: CPU_nRDY, dir: out, pin: 34}
          - {name: CPU_SYNC, dir: in, pin: 37}
          - {name: CPU_IRQ, width: 4, dir: out, pin: [38, 39, 41, 42]}
          - {name: CPU_TMR_EXP, width: 2, dir: in, pin: [43, 44]}
          - {name: CPU_HALTED, dir: in, pin: 45}
          - {name: CPU_WAITING, dir: in, pin: 47}
      memory_bus:
        note: SRAM IS62WV5128 + ROM SST39VF040 on one bus
        signals:
          - {name: MEM_A, width: 19, dir: out, pin: [110, 112, 113, 114, 115, 116, 117, 118, 119, 120, 121, 122, 124, 125, 128, 129, 130, 134, 135]}
          - {name: MEM_D, width: 8, dir: inout, pin: [136, 137, 138, 139, 141, 142, 143, 144]}
          - {name: MEM_nOE, dir: out, pin: 73}
          - {name: MEM_nWE, dir: out, pin: 74}
          - {name: MEM_nCE_RAM, dir: out, pin: 75}
          - {name: MEM_nCE_ROM, dir: out, pin: 76}
      slots:
        note: SPI to slots 1-6 (dev 0-5) and the aux header (dev 6)
        signals:
          - {name: SPI_SCK, dir: out, pin: 78}
          - {name: SPI_MOSI, dir: out, pin: 79}
          - {name: SPI_MISO, dir: in, pin: 80}
          - {name: SPI_nCS, width: 7, dir: out, pin: [81, 82, 83, 84, 85, 87, 88]}
          - {name: SLOT_nIRQ, width: 6, dir: in, pin: [90, 91, 93, 94, 95, 96]}
      bridge:
        note: SPI slave to sysctl
        signals:
          - {name: BR_SCK, dir: in, pin: 97}
          - {name: BR_MOSI, dir: in, pin: 98}
          - {name: BR_MISO, dir: out, pin: 99}
          - {name: BR_nCS, dir: in, pin: 101}
      misc:
        signals:
          - {name: CLK12, dir: in, role: gbin, pin: 21}
          - {name: nPOR, dir: in, note: from the reset supervisor, pin: 102}
          - {name: GPO, width: 8, dir: out, note: LEDs D1-D8, pin: [52, 55, 56, 60, 61, 62, 63, 64]}
          - {name: CPU_nRST, dir: out, pin: 48}
          - {name: PWR_HI, dir: in, note: USB-C source >= 1.5 A (CC comparator), pin: 104}
          - {name: CPU_CDONE, dir: in, note: CPU card configured; pulled up (doc/hardware/cpu-bus.md), pin: 49}

  cpu_fpga:
    board: cpu-card
    part: ICE40HX4K-TQ144
    lcsc: C1521989
    package: TQFP-144
    note: the same part as the chipset, so one footprint and one stock pool
    groups:
      cpu_bus:
        signals:
          - {name: CPU_A, width: 16, dir: out, pin: [1, 2, 3, 4, 7, 8, 9, 10, 11, 12, 15, 16, 17, 18, 19, 20]}
          - {name: CPU_D, width: 8, dir: inout, pin: [37, 38, 39, 41, 42, 43, 44, 45]}
          - {name: CPU_RW, dir: out, pin: 25}
          - {name: CPU_nSTB, dir: out, pin: 23}
          - {name: CPU_nRDY, dir: in, pin: 24}
          - {name: CPU_SYNC, dir: out, pin: 26}
          - {name: CPU_IRQ, width: 4, dir: in, pin: [47, 48, 49, 52]}
          - {name: CPU_TMR_EXP, width: 2, dir: out, pin: [55, 56]}
          - {name: CPU_HALTED, dir: out, pin: 60}
          - {name: CPU_WAITING, dir: out, pin: 61}
          - {name: CPU_CLK, dir: in, role: gbin, pin: 21}
          - {name: CPU_nRST, dir: in, pin: 22}

  sysctl:
    board: system-card
    part: RP2040
    lcsc: C2040
    package: QFN-56
    note: >
      all 30 GPIO used. The two flash buses share SPI1 on its two pin sets
      (only one flash is programmed at a time); every bus pin is an input
      unless sysctl holds that FPGA's CRESET_n low (doc/hardware/system-slot.md)
    groups:
      bridge:
        note: SPI0 to the chipset's bus bridge
        signals:
          - {name: BR_SCK, gpio: 2, dir: out}
          - {name: BR_MOSI, gpio: 3, dir: out}
          - {name: BR_MISO, gpio: 4, dir: in}
          - {name: BR_nCS, gpio: 5, dir: out}
      chipset_flash:
        note: SPI1 (GPIO 10-13) to the chipset's W25Q config flash
        signals:
          - {name: FL0_SCK, gpio: 10, dir: out}
          - {name: FL0_MOSI, gpio: 11, dir: out}
          - {name: FL0_MISO, gpio: 12, dir: in}
          - {name: FL0_nCS, gpio: 13, dir: out}
          - {name: CHIPSET_nCRESET, gpio: 6, dir: out, note: open drain}
          - {name: CHIPSET_CDONE, gpio: 7, dir: in}
      cpucard_flash:
        note: SPI1 (GPIO 14, 15, 8, 9) to the CPU card's W25Q, through the CPU socket
        signals:
          - {name: FL1_SCK, gpio: 14, dir: out}
          - {name: FL1_MOSI, gpio: 15, dir: out}
          - {name: FL1_MISO, gpio: 8, dir: in}
          - {name: FL1_nCS, gpio: 9, dir: out}
          - {name: CPUCARD_nCRESET, gpio: 16, dir: out, note: open drain}
          - {name: CPUCARD_CDONE, gpio: 17, dir: in}
      cards:
        note: one programming port muxed to the slots (SWD for RP2040, UART for ESP32)
        signals:
          - {name: PROG_CLK, gpio: 18, dir: inout}
          - {name: PROG_IO, gpio: 19, dir: inout}
          - {name: MUX_SEL, width: 3, gpio: [20, 21, 22], dir: out}
      i2c:
        note: I2C0 to two TCA9555 expanders (CARD_RST_n, PROG_n, presence)
        signals:
          - {name: I2C_SDA, gpio: 24, dir: inout}
          - {name: I2C_SCL, gpio: 25, dir: out}
      misc:
        signals:
          - {name: SYS_nRST, gpio: 23, dir: out, note: open drain onto the reset supervisor output}
          - {name: LED_USB_TX, gpio: 0, dir: out, note: "USB activity to the host, lit ~30 ms (milestone-1.md, Indicator LEDs); was the debug UART, which nothing used"}
          - {name: LED_USB_RX, gpio: 1, dir: out, note: USB activity from the host, lit ~30 ms}
          - {name: CC1_SENSE, gpio: 26, dir: adc}
          - {name: CC2_SENSE, gpio: 27, dir: adc}
          - {name: V1V2_SENSE, gpio: 28, dir: adc}
          - {name: LED_STATUS, gpio: 29, dir: out}

  gpu_mcu:
    board: gpu-card
    part: RP2040
    lcsc: C2040
    note: "TMDS pairs are GPIO n and n+1 with P on n+1 (PicoDVI invert_diffpairs): lanes {12, 14, 16}, clock 10, inverted. Around the RP2040 that puts the pairs in the HDMI receptacle's own order (D2, D1, D0, clock, each P before N), so the GPU card routes them as coupled pairs with no crossings or vias (hw/boards/README.md)"
    groups:
      dvi:
        signals:
          - {name: TMDS_D0, width: 2, gpio: [12, 13], dir: out, note: "blue pair, P on 13"}
          - {name: TMDS_D1, width: 2, gpio: [14, 15], dir: out, note: "green pair, P on 15"}
          - {name: TMDS_D2, width: 2, gpio: [16, 17], dir: out, note: "red pair, P on 17"}
          - {name: TMDS_CLK, width: 2, gpio: [10, 11], dir: out, note: "P on 11"}
          - {name: HDMI_HPD, gpio: 18, dir: in}
          - {name: HDMI_SCL, gpio: 19, dir: inout}
          - {name: HDMI_SDA, gpio: 20, dir: inout}
      slot:
        signals:
          - {name: SLOT_SCK, gpio: 2, dir: in}
          - {name: SLOT_MOSI, gpio: 3, dir: in}
          - {name: SLOT_MISO, gpio: 4, dir: out}
          - {name: SLOT_nCS, gpio: 5, dir: in}
          - {name: SLOT_nIRQ, gpio: 6, dir: out, note: open drain}
      debug:
        signals:
          - {name: LED_ACT, gpio: 25, dir: out}
          - {name: UART_TX, gpio: 0, dir: out}

  io_mcu:
    board: io-card
    part: RP2040
    lcsc: C2040
    groups:
      usb_host:
        signals:
          - {name: USB_DP, pin: USB_DP, dir: inout, note: "native USB host port: a dedicated RP2040 pin, not a GPIO"}
          - {name: USB_DM, pin: USB_DM, dir: inout, note: "native USB host port: a dedicated RP2040 pin, not a GPIO"}
          - {name: VBUS_EN, gpio: 7, dir: out}
          - {name: VBUS_nFAULT, gpio: 8, dir: in}
      slot:
        signals:
          - {name: SLOT_SCK, gpio: 2, dir: in}
          - {name: SLOT_MOSI, gpio: 3, dir: in}
          - {name: SLOT_MISO, gpio: 4, dir: out}
          - {name: SLOT_nCS, gpio: 5, dir: in}
          - {name: SLOT_nIRQ, gpio: 6, dir: out, note: open drain}
      debug:
        signals:
          - {name: LED_KBD, gpio: 25, dir: out, note: keyboard connected}
          - {name: LED_KEY, gpio: 24, dir: out, note: "keyboard activity: lit ~30 ms after each HID report"}
          - {name: UART_TX, gpio: 16, dir: out}

  storage_mcu:
    board: storage-card
    part: RP2040
    lcsc: C2040
    groups:
      slot:
        signals:
          - {name: SLOT_SCK, gpio: 2, dir: in}
          - {name: SLOT_MOSI, gpio: 3, dir: in}
          - {name: SLOT_MISO, gpio: 4, dir: out}
          - {name: SLOT_nCS, gpio: 5, dir: in}
          - {name: SLOT_nIRQ, gpio: 6, dir: out, note: open drain}
      sd:
        note: "microSD in SPI mode on SPI1 (doc/hardware/storage-card.md); 10k pull-ups on CMD/DAT0-3"
        signals:
          - {name: SD_SCK, gpio: 14, dir: out, note: SPI1 SCK}
          - {name: SD_MOSI, gpio: 15, dir: out, note: "SPI1 TX, to the card's CMD"}
          - {name: SD_MISO, gpio: 12, dir: in, note: "SPI1 RX, from the card's DAT0"}
          - {name: SD_nCS, gpio: 13, dir: out, note: "SPI1 CSn, to the card's DAT3/CD"}
          - {name: SD_nDETECT, gpio: 17, dir: in, note: "socket card-detect switch, pulled up: low = card in"}
          - {name: SD_DAT1, gpio: 18, dir: in, note: "pulled up, unused in SPI mode: routed for a later 4-bit mode on PIO"}
          - {name: SD_DAT2, gpio: 19, dir: in, note: "pulled up, unused in SPI mode: routed for a later 4-bit mode on PIO"}
      debug:
        signals:
          - {name: LED_ACT, gpio: 24, dir: out, note: "medium activity, lit ~30 ms after each access"}
          - {name: LED_CARD, gpio: 25, dir: out, note: "a card is inserted and mounted"}
          - {name: UART_TX, gpio: 16, dir: out}

  eink_mcu:
    board: eink-card
    part: RP2040
    lcsc: C2040
    note: "the e-ink graphics card (doc/proposals/eink-gpu.md, Decisions): the panel's driver module on a 2.54 mm 9-pin header"
    groups:
      slot:
        signals:
          - {name: SLOT_SCK, gpio: 2, dir: in}
          - {name: SLOT_MOSI, gpio: 3, dir: in}
          - {name: SLOT_MISO, gpio: 4, dir: out}
          - {name: SLOT_nCS, gpio: 5, dir: in}
          - {name: SLOT_nIRQ, gpio: 6, dir: out, note: open drain}
      panel:
        note: "the module's 9-pin cable: VCC (3V3), GND, DIN, CLK, CS, DC, RST, BUSY, PWR; SPI1 write-only"
        signals:
          - {name: EPD_CLK, gpio: 10, dir: out, note: SPI1 SCK}
          - {name: EPD_DIN, gpio: 11, dir: out, note: SPI1 TX}
          - {name: EPD_nCS, gpio: 9, dir: out, note: SPI1 CSn}
          - {name: EPD_DC, gpio: 12, dir: out, note: "data (1) or command (0)"}
          - {name: EPD_nRST, gpio: 13, dir: out}
          - {name: EPD_BUSY, gpio: 14, dir: in, note: "UC8179: low while busy"}
          - {name: EPD_PWR, gpio: 15, dir: out, note: "the module's power switch (Waveshare HAT V2 PWR pin): high = on"}
      debug:
        signals:
          - {name: LED_REFRESH, gpio: 24, dir: out, note: "lit while the panel refreshes"}
          - {name: UART_TX, gpio: 16, dir: out}

  wifi_mcu:
    board: wifi-card
    part: ESP32-C3-MINI-1U-N4
    lcsc: C2911374
    groups:
      slot:
        note: GPSPI2 through the GPIO matrix
        signals:
          - {name: SLOT_SCK, gpio: 6, dir: in}
          - {name: SLOT_MOSI, gpio: 7, dir: in}
          - {name: SLOT_MISO, gpio: 5, dir: out, note: "not GPIO2: that is a strapping pin, and the shared MISO line can be low while this card resets"}
          - {name: SLOT_nCS, gpio: 10, dir: in}
          - {name: SLOT_nIRQ, gpio: 3, dir: out, note: open drain}
      program:
        note: the slot's programming port speaks UART to the ESP ROM bootloader
        signals:
          - {name: U0RXD, gpio: 20, dir: in, from: SWCLK}
          - {name: U0TXD, gpio: 21, dir: out, to: SWDIO}
          - {name: BOOT_STRAP, gpio: 9, dir: in, from: PROG_n}
      debug:
        signals:
          - {name: LED_LINK, gpio: 4, dir: out}
          - {name: LED_TX, gpio: 0, dir: out, note: "socket data sent (milestone-1.md, Indicator LEDs)"}
          - {name: LED_RX, gpio: 1, dir: out, note: "socket data received"}

# Connector pinouts (doc/hardware/cpu-bus.md, doc/hardware/slot.md). The
# checker compares these against the docs and the KiCad netlists.
connectors:
  cpu_socket:
    type: PCIe x8 card edge, 98 contacts
    lcsc: C404111
    pins_file: doc/hardware/cpu-bus.md
  system_slot:
    type: PCIe x4 card edge, 64 contacts
    lcsc: C19188869
    pins_file: doc/hardware/system-slot.md
  slot:
    type: PCIe x1 card edge, 36 contacts
    lcsc: C404113
    count: 6
    pins_file: doc/hardware/slot.md
