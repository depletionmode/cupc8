# W25Q16JVSSIQ (Winbond), 16 Mbit SPI/QSPI NOR flash, SOIC-8 208 mil
datasheet: https://www.winbond.com/resource-files/w25q16jv%20spi%20revh%2004082019%20plus.pdf
source: "W25Q16JV datasheet, 3.1 Pin Configuration SOIC 208-mil (top view) and 3.3 Pin Description"
package: SOIC-8-208mil
pins:
  1: ["~{CS}", "/CS", "CS"]
  2: ["DO/IO_{1}", "DO", "IO1"]
  3: ["~{WP}/IO_{2}", "/WP", "IO2"]
  4: GND
  5: ["DI/IO_{0}", "DI", "IO0"]
  6: CLK
  7: ["~{HOLD}/~{RESET}/IO_{3}", "/HOLD", "/RESET", "IO3"]
  8: VCC
ccw: [1, 8]
