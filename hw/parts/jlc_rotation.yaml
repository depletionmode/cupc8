  source: 'derived by bomcheck.py: the KiCad pads onto EasyEDA''s SOT-223-3_L6.5-W3.4-P2.30-LS7.0-BR (C6186)'
jlc:SOT-23-5_L3.0-W1.7-P0.95-LS2.8-BR:
  rotation: 0
  source: 'derived by bomcheck.py: the KiCad pads onto EasyEDA''s SOT-23-5_L3.0-W1.7-P0.95-LS2.8-BR (C141836)'
