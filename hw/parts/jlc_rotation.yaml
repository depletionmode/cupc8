# JLC CPL rotation corrections: KiCad footprint -> degrees added to KiCad's
# rotation in cpl.csv (hw/tools/kicadgen.py jlc_fab applies them).
#
# JLC's placer turns its own footprint for the LCSC part (the EasyEDA one the
# part links to) by the CPL angle. A KiCad footprint drawn in another
# orientation (pin 1 or the cathode somewhere else) needs the difference.
# hw/tools/bomcheck.py derives it for every BOM line by turning the KiCad
# pads onto EasyEDA's (pin numbers for ICs, K/A for LEDs, either way for
# resistors and capacitors) and fails when an entry here disagrees or is
# missing; `bomcheck.py <board> --update-rotations` adds new footprints.
# Every footprint in a BOM needs an entry, 0 included, so none is unchecked.

Capacitor_SMD:C_0603_1608Metric:
  rotation: 0
  source: 'derived by bomcheck.py: the KiCad pads onto EasyEDA''s C0603 (C14663, C15849)'
Capacitor_SMD:C_0805_2012Metric:
  rotation: 0
  source: 'derived by bomcheck.py: the KiCad pads onto EasyEDA''s C0805 (C45783)'
LED_SMD:LED_0603_1608Metric:
  rotation: 0
  source: 'derived by bomcheck.py: the KiCad pads onto EasyEDA''s LED-SMD_L1.6-W0.8-R-RD, LED0603-RD (C12624, C2286)'
