# HDMI 19PIN 043 (SHOU HAN), HDMI type-A receptacle, SMD right angle, THT shell legs
datasheet: https://wmsc.lcsc.com/wmsc/upload/file/pdf/v2/lcsc/2306201607_SHOU-HAN-HDMI-19PIN-043_C2858275.pdf
source: "SHOU HAN HDMI 19PIN 043 drawing, page 3 (19 contacts at 0.50 mm, the recommended PCB layout); pin functions are the HDMI 1.4 type A receptacle's (1 TMDS Data2+ ... 19 Hot Plug Detect); 20 is the shell's four legs"
package: SMD
