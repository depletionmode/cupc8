  6: TMDSData1-
  7: TMDSData0+
  8: TMDSData0Shield
  9: TMDSData0-
  10: TMDSClock+
  11: TMDSClockShield
  12: TMDSClock-
  13: CEC
  14: [Reserved(N.C.), Utility]
