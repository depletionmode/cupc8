# AMS1117-3.3 (Advanced Monolithic Systems), 1 A LDO, SOT-223
datasheet: https://datasheet.lcsc.com/datasheet/pdf/e6935943fc6b1bbf350a1a0f3e90dc4a.pdf
source: "AMS1117 datasheet, page 1: Pin connections, SOT-223 top view (3 pin fixed/adjustable: 1 Ground/Adjust, 2 VOUT, 3 VIN; the tab is the output)"
package: SOT-223
pins:
  1: [GND, ADJ, GND/ADJ]   # "Ground/Adjust": ground on the fixed 3.3 V part
  2: VOUT
  3: VIN
  4: VOUT                  # the tab
ccw: [1, 4]                # 1-3 in a row, the tab opposite
