# JLC's part C12624 as hw/tools/bomcheck.py fetched it: JLC's package name, and the
# EasyEDA footprint JLC places (pads: number, x, y up, mm) with its symbol's pin
# names. bomcheck.py --refetch compares it with JLC's today.
lcsc: C12624
jlc_package: '0603'
easyeda_footprint: LED0603-RD
pins: {'1': K, '2': A}
pads:
- ['2', 0.75, 0.0]
- ['1', -0.75, 0.0]
