# JLC's part C7272 as hw/tools/bomcheck.py fetched it: JLC's package name, and the
# EasyEDA footprint JLC places (pads: number, x, y up, mm) with its symbol's pin
# names. bomcheck.py --refetch compares it with JLC's today.
lcsc: C7272
jlc_package: SOT-143
easyeda_footprint: SOT-143_L2.9-W1.3-P1.92-LS2.3-BR
pins: {'1': GND, '2': '~{RESET}', '3': '~{MR}', '4': VCC}
pads:
- ['1', 1.1, -0.75]
- ['2', 1.1, 0.95]
- ['3', -1.1, 0.95]
- ['4', -1.1, -0.95]
