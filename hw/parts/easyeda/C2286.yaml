# JLC's part C2286 as hw/tools/bomcheck.py fetched it: JLC's package name, and the
# EasyEDA footprint JLC places (pads: number, x, y up, mm) with its symbol's pin
# names. bomcheck.py --refetch compares it with JLC's today.
lcsc: C2286
jlc_package: '0603'
easyeda_footprint: LED-SMD_L1.6-W0.8-R-RD
pins: {'1': A, '2': K}
pads:
- ['2', -0.75, 0.0]
- ['1', 0.75, 0.0]
