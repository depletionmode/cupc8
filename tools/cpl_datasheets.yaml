# (rendered by `tools/cpl_review_pack.py datasheets`, cropped to `crop`) by
# whoever recorded it (Claude, 2026-09-29, from the rendered page images).
# tools/cpl_review_pack.py compares these records with the KiCad footprint on
# the board by code (pin names pad for pad, numbering direction seen from the
# top): the record is the datasheet's side only. `result: could not determine`
# means the drawing could not be obtained or read; nothing is guessed.
#
# Fields: url (where the PDF came from), page (1-based PDF page of the
# pin/package drawing), crop [x0, y0, x1, y1] as fractions of the page, seen
# (one line: what the drawing shows), numbering (ccw|cw: how the pin numbers
# run seen from the top, for ring/two-row packages), ring (pads 1..N, or a
# list, that form that ring), pins {pad: name at that pad}, others (name for
# every pad not listed), text_pages (pages whose text is searched for the pin
# names when `pins` is not transcribed).

